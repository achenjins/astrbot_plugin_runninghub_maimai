<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>工作流节点配置</title>
<link rel="stylesheet" href="./style.css">
<style>
*{box-sizing:border-box}
.hidden{display:none!important}
:root{
  --primary:#3c96ca;--primary-dark:#1565c0;--primary-light:#e8f3fa;
  --secondary:#2f86bd;--info:#03c9d7;--success:#00c853;--warning:#ffc107;--error:#f44336;
  --bg:#ffffff;--surface:#ffffff;--surface-2:#f6f7fb;--text:#1b1c1d;--muted:rgba(0,0,0,.62);
  --border:#d0d0d0;--divider:rgba(0,0,0,.08);
  --radius:12px;--shadow:0 1px 2px rgba(0,0,0,.06);--shadow-2:0 6px 18px rgba(0,0,0,.10);
  --overlay:rgba(0,0,0,.46);
}
@media (prefers-color-scheme: dark){
  :root{
    --primary:#5ba4d4;--primary-dark:#3a8ab8;--primary-light:#1a2e3d;
    --secondary:#4a95c4;--info:#03c9d7;--success:#52c41a;--warning:#faad14;--error:#ff4d4f;
    --bg:#1a1a1a;--surface:#242424;--surface-2:#2a2a2a;--text:#e8eaed;--muted:rgba(255,255,255,.68);
    --border:#3a3a3a;--divider:rgba(255,255,255,.08);
    --shadow:0 1px 2px rgba(0,0,0,.42);--shadow-2:0 8px 22px rgba(0,0,0,.42);
    --overlay:rgba(0,0,0,.58);
  }
}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:14px/1.5 Roboto,"Helvetica Neue",Arial,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
svg.icon{display:block;flex:0 0 auto}
.rotate-180{transform:rotate(180deg)}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{
  font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);
  border-radius:10px;min-height:42px;padding:9px 12px;outline:none;transition:border-color .15s,box-shadow .15s;
}
input:hover,select:hover,textarea:hover{border-color:rgba(60,150,202,.55)}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
textarea{resize:vertical;min-height:68px}
.app{max-width:1400px;margin:0 auto;padding:22px 24px 72px}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;height:64px;
  padding:0 4px;margin-bottom:22px;background:var(--bg);border-bottom:1px solid var(--divider);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.logo-mark{
  width:38px;height:38px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--primary-light);color:var(--primary);
}
.brand h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px}
.brand .sub{margin:1px 0 0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{
  min-height:36px;padding:0 14px;border-radius:10px;border:1px solid transparent;background:var(--surface-2);color:var(--text);
  display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:500;
  transition:background .15s,color .15s,border-color .15s,box-shadow .15s,opacity .15s;
}
.btn:hover:not(:disabled){background:var(--primary-light)}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--primary-dark)}
.btn.outlined{background:transparent;border-color:var(--border)}
.btn.outlined:hover:not(:disabled){border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.btn.text{background:transparent}
.btn.text:hover:not(:disabled){background:var(--primary-light)}
.btn.danger-text{background:transparent;color:var(--error)}
.btn.danger-text:hover:not(:disabled){background:rgba(244,67,54,.08)}
.btn.small{min-height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.icon-btn{
  width:36px;height:36px;display:inline-grid;place-items:center;border-radius:10px;border:none;
  background:transparent;color:var(--muted);transition:.15s;
}
.icon-btn:hover{background:var(--primary-light);color:var(--primary)}
.icon-btn.danger:hover{background:rgba(244,67,54,.08);color:var(--error)}
.icon-btn.small{width:30px;height:30px;border-radius:8px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:0 0 18px}
.stat-card{
  min-height:86px;padding:14px 16px;border:1px solid var(--divider);border-radius:var(--radius);
  background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;
  transition:box-shadow .18s,border-color .18s;
}
.stat-card:hover{border-color:var(--border);box-shadow:var(--shadow-2)}
.stat-icon{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto}
.stat-icon.blue{background:var(--primary-light);color:var(--primary)}
.stat-icon.teal{background:rgba(3,201,215,.10);color:var(--info)}
.stat-icon.green{background:rgba(0,200,83,.10);color:var(--success)}
.stat-icon.amber{background:rgba(255,193,7,.12);color:var(--warning)}
.stat-body b{font-size:20px;font-weight:600;line-height:1.15;display:block}
.stat-body span{color:var(--muted);font-size:12px}
.toolbar{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:220px;max-width:420px}
.search-wrap input{width:100%;padding-left:40px}
.search-wrap .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;appearance:none;padding-right:30px}
.dirty-badge{
  font-size:12px;font-weight:500;color:var(--warning);background:rgba(255,193,7,.10);border:1px solid rgba(255,193,7,.35);
  padding:4px 10px;border-radius:999px;opacity:0;transform:translateY(2px);transition:.18s;pointer-events:none;
}
.dirty-badge.show{opacity:1;transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px;align-items:start}
.workflow-card{
  border:1px solid var(--divider);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);
  overflow:hidden;animation:rise .18s ease both;transition:border-color .18s,box-shadow .18s;content-visibility:auto;contain-intrinsic-size:auto 230px;
}
.workflow-card:hover{border-color:var(--border);box-shadow:var(--shadow-2)}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.wf-head{display:flex;gap:10px;align-items:flex-start;padding:14px 16px 10px}
.wf-title{min-width:0;flex:1}
.wf-title h2{margin:0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wf-title .wf-id{color:var(--muted);font-family:ui-monospace,Consolas,monospace;font-size:12px;font-weight:400;word-break:break-all}
.wf-actions{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.badges{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.badge{
  display:inline-flex;align-items:center;gap:5px;height:24px;font-size:11px;font-weight:500;padding:0 8px;border-radius:7px;
  background:var(--surface-2);color:var(--muted);border:1px solid var(--divider);
}
.badge.overseas{color:var(--primary);background:var(--primary-light);border-color:rgba(60,150,202,.25)}
.badge.domestic{color:var(--secondary);background:rgba(47,134,189,.10);border-color:rgba(47,134,189,.25)}
.badge.llm{color:var(--primary);background:var(--primary-light);border-color:rgba(60,150,202,.3)}
.node-zone{border-top:1px solid var(--divider);padding:12px 16px 16px}
.node-zone-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;color:var(--muted);font-size:12px}
.node-zone-head b{color:var(--text);font-weight:600}
.node-zone-head .spacer{flex:1}
.node-list{display:flex;flex-direction:column;gap:7px;min-height:42px}
.node-empty{border:1px dashed var(--border);border-radius:10px;padding:16px;text-align:center;color:var(--muted);font-size:12px}
.node-row{
  display:grid;grid-template-columns:14px 34px minmax(0,1fr) auto auto;align-items:center;gap:9px;
  border:1px solid var(--divider);border-radius:10px;padding:8px 9px;background:var(--surface-2);
  transition:border-color .14s,box-shadow .14s,transform .14s,opacity .14s;
}
.node-row:hover{border-color:var(--border);box-shadow:var(--shadow)}
.node-row.dragging{opacity:.45;transform:scale(.99)}
.node-row.drop-before{box-shadow:inset 0 3px 0 var(--primary);border-color:var(--primary)}
.node-row.drop-after{box-shadow:inset 0 -3px 0 var(--primary);border-color:var(--primary)}
.drag-handle{cursor:grab;color:var(--muted);user-select:none;display:grid;place-items:center}
.drag-handle:active{cursor:grabbing}
.type-tag{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;height:26px;padding:0 8px;border-radius:7px;
  font-size:11px;font-weight:500;white-space:nowrap;border:1px solid;min-width:34px;
}
.type-prompt{color:#1565c0;background:rgba(21,101,192,.08);border-color:rgba(21,101,192,.22)}
.type-text{color:#00838f;background:rgba(0,131,143,.08);border-color:rgba(0,131,143,.22)}
.type-default{color:#546e7a;background:rgba(84,110,122,.08);border-color:rgba(84,110,122,.22)}
.type-image{color:#2e7d32;background:rgba(46,125,50,.08);border-color:rgba(46,125,50,.22)}
.type-audio{color:#ef6c00;background:rgba(239,108,0,.08);border-color:rgba(239,108,0,.22)}
.type-video{color:#ad1457;background:rgba(173,20,87,.08);border-color:rgba(173,20,87,.22)}
@media (prefers-color-scheme: dark){
  .type-prompt{color:#90caf9;background:rgba(144,202,249,.10);border-color:rgba(144,202,249,.25)}
  .type-text{color:#80deea;background:rgba(128,222,234,.10);border-color:rgba(128,222,234,.25)}
  .type-default{color:#b0bec5;background:rgba(176,190,197,.10);border-color:rgba(176,190,197,.25)}
  .type-image{color:#a5d6a7;background:rgba(165,214,167,.10);border-color:rgba(165,214,167,.25)}
  .type-audio{color:#ffcc80;background:rgba(255,204,128,.10);border-color:rgba(255,204,128,.25)}
  .type-video{color:#f48fb1;background:rgba(244,143,177,.10);border-color:rgba(244,143,177,.25)}
}
.node-core{min-width:0}
.node-key{display:flex;align-items:baseline;gap:5px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;font-weight:600}
.node-key .sep{color:var(--muted);font-weight:400}
.node-key .fname{color:var(--primary)}
.node-value{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}
.node-label{font-size:12px;color:var(--muted);max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-actions{display:flex;align-items:center;gap:1px}
.empty{border:1px dashed var(--border);border-radius:var(--radius);padding:64px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.empty .big{color:var(--primary);margin-bottom:12px}
.empty h3{margin:0 0 6px;color:var(--text);font-size:16px;font-weight:600}
.empty code{background:var(--surface-2);border:1px solid var(--divider);padding:1px 6px;border-radius:6px}
.template-row{display:flex;align-items:center;gap:8px}
.template-row select{flex:1;min-width:0}
.preview-text{width:100%;min-height:380px;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.6}
dialog{border:0;padding:0;border-radius:var(--radius);background:var(--surface);color:var(--text);box-shadow:0 24px 48px rgba(0,0,0,.24);width:min(560px,calc(100vw - 28px));max-height:min(86vh,820px)}
dialog::backdrop{background:var(--overlay)}
.dialog{display:flex;flex-direction:column;max-height:min(86vh,820px)}
.dialog-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--divider)}
.dialog-head h3{margin:0;font-size:15px;font-weight:600}
.dialog-head .close-x{margin-left:auto}
.dialog-body{padding:16px 20px 20px;overflow:auto}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:500;color:var(--muted)}
.field .hint{font-size:11.5px;color:var(--muted)}
.field .hint.warn{color:var(--warning)}
.check-row{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--divider);border-radius:10px;background:var(--surface);min-height:42px}
.check-row:hover{border-color:var(--primary)}
.check-row input{width:18px;height:18px;min-height:0;accent-color:var(--primary)}
.dialog-foot{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:14px 20px;border-top:1px solid var(--divider)}
.analyze-box{border:1px solid var(--divider);border-radius:10px;padding:12px;background:var(--surface-2);min-height:86px}
.analyze-box .node-chip{
  display:inline-flex;align-items:center;gap:6px;margin:0 6px 6px 0;padding:4px 9px;border-radius:7px;
  border:1px solid var(--divider);background:var(--surface);font-size:12px;
}
.analyze-box .muted{color:var(--muted);font-size:12px}
#toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:min(560px,calc(100vw - 32px))}
.toast{
  min-width:260px;max-width:100%;padding:10px 16px;border-radius:10px;background:var(--surface);color:var(--text);
  border:1px solid var(--divider);box-shadow:0 8px 24px rgba(0,0,0,.22);font-size:13px;display:flex;gap:9px;align-items:center;
  animation:toast-in .18s ease both;
}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary);flex:0 0 auto}
.toast.ok::before{background:var(--success)}.toast.err::before{background:var(--error)}.toast.warn::before{background:var(--warning)}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateY(6px);transition:.18s}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;border:2px solid var(--bg)}
@media (max-width:640px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
  .app{padding:12px 12px 64px}
  .brand .sub{display:none}
  .topbar{height:56px;margin-bottom:14px}
  .node-row{grid-template-columns:12px 32px minmax(0,1fr) auto;grid-template-areas:"drag tag core actions"}
  .drag-handle{grid-area:drag}.type-tag{grid-area:tag}.node-core{grid-area:core}.node-actions{grid-area:actions}
  .node-label{display:none}
  .form-grid{grid-template-columns:1fr}
  dialog{width:calc(100vw - 20px)}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo-mark"><span class="icon icon-sitemap" style="width:20px;height:20px" aria-hidden="true"></span></div>
      <div>
        <h1>工作流输入节点</h1>
        <p class="sub" id="pluginMeta">runninghub_workflow_adapter</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn text" id="refreshBtn" title="重新读取配置"><span class="icon icon-refresh" style="width:18px;height:18px" aria-hidden="true"></span>刷新</button>
      <button class="btn primary" id="addWorkflowBtn"><span class="icon icon-plus" style="width:18px;height:18px" aria-hidden="true"></span>新建工作流</button>
      <button class="btn outlined" id="saveBtn" disabled><span class="icon icon-save" style="width:18px;height:18px" aria-hidden="true"></span>保存配置</button>
    </div>
  </header>

  <section class="stat-grid" id="statGrid">
    <div class="stat-card"><div class="stat-icon blue"><span class="icon icon-sitemap" style="width:20px;height:20px" aria-hidden="true"></span></div><div class="stat-body"><b id="statWorkflows">0</b><span>工作流</span></div></div>
    <div class="stat-card"><div class="stat-icon teal"><span class="icon icon-tune" style="width:20px;height:20px" aria-hidden="true"></span></div><div class="stat-body"><b id="statNodes">0</b><span>输入节点</span></div></div>
    <div class="stat-card"><div class="stat-icon green"><span class="icon icon-prompt" style="width:20px;height:20px" aria-hidden="true"></span></div><div class="stat-body"><b id="statPrompts">0</b><span>主提示词</span></div></div>
    <div class="stat-card"><div class="stat-icon amber"><span class="icon icon-paperclip" style="width:20px;height:20px" aria-hidden="true"></span></div><div class="stat-body"><b id="statFiles">0</b><span>图片 / 语音 / 视频</span></div></div>
  </section>

  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon"><span class="icon icon-magnify" style="width:18px;height:18px" aria-hidden="true"></span></span>
      <input id="searchInput" type="search" placeholder="搜索工作流名称、ID 或节点字段…" autocomplete="off">
    </div>
    <select id="regionFilter" aria-label="按区域筛选">
      <option value="all">全部区域</option>
      <option value="overseas">国外 runninghub.ai</option>
      <option value="domestic">国内 runninghub.cn</option>
    </select>
    <span class="dirty-badge" id="dirtyBadge">● 未保存</span>
  </div>

  <main class="grid" id="workflowGrid"></main>
  <div class="empty hidden" id="emptyState">
    <div class="big"><span class="icon icon-sitemap" style="width:44px;height:44px" aria-hidden="true"></span></div>
    <h3>还没有工作流</h3>
    <p>点击右上角「新建工作流」，或回到聊天窗口发送 <code>/wf国外工作流 工作流ID 名称</code> 自动识别。</p>
  </div>
</div>

<dialog id="workflowDialog">
  <div class="dialog">
    <div class="dialog-head"><h3 id="workflowDialogTitle">新建工作流</h3><button class="icon-btn close-x" data-close="workflowDialog"><span class="icon icon-close" style="width:18px;height:18px" aria-hidden="true"></span></button></div>
    <div class="dialog-body">
      <div class="form-grid">
        <div class="field full"><label for="wfName">工作流名称 *</label><input id="wfName" maxlength="64" placeholder="例如：动漫生图"></div>
        <div class="field full"><label for="wfId">工作流 ID *</label><input id="wfId" maxlength="64" placeholder="例如：2087492768787685378"></div>
        <div class="field"><label for="wfInstance">设备类型</label>
          <select id="wfInstance"><option value="Standard">Standard</option><option value="Plus">Plus</option><option value="Ultra">Ultra</option></select>
        </div>
        <div class="field"><label for="wfRegion">区域</label>
          <select id="wfRegion"><option value="overseas">国外 runninghub.ai</option><option value="domestic">国内 runninghub.cn</option></select>
        </div>
        <div class="field full">
          <label for="wfTemplate">LLM 扩写模板</label>
          <div class="template-row">
            <select id="wfTemplate"></select>
            <button class="btn outlined small" id="wfUploadBtn" type="button"><span class="icon icon-upload" style="width:14px;height:14px" aria-hidden="true"></span>上传</button>
            <button class="btn text small" id="wfPreviewBtn" type="button"><span class="icon icon-preview" style="width:14px;height:14px" aria-hidden="true"></span>预览</button>
          </div>
          <input type="file" id="wfTemplateFile" accept=".txt,.md,text/plain,text/markdown" hidden>
          <div class="hint" id="wfTemplateHint">模板存放在插件 prompt/ 目录，上传成功后会自动选中。</div>
        </div>
        <div class="field full"><label class="check-row"><input type="checkbox" id="wfEnhance"> 启用 LLM 提示词扩写</label></div>
      </div>
    </div>
    <div class="dialog-foot">
      <button class="btn text" data-close="workflowDialog">取消</button>
      <button class="btn primary" id="workflowSaveBtn"><span class="icon icon-save" style="width:18px;height:18px" aria-hidden="true"></span>保存工作流</button>
    </div>
  </div>
</dialog>

<dialog id="nodeDialog">
  <div class="dialog">
    <div class="dialog-head"><h3 id="nodeDialogTitle">添加输入节点</h3><button class="icon-btn close-x" data-close="nodeDialog"><span class="icon icon-close" style="width:18px;height:18px" aria-hidden="true"></span></button></div>
    <div class="dialog-body">
      <div class="form-grid">
        <div class="field full"><label for="nodeWorkflow">所属工作流</label><select id="nodeWorkflow"></select></div>
        <div class="field"><label for="nodeId">节点 ID *</label><input id="nodeId" maxlength="32" placeholder="例如：353"></div>
        <div class="field"><label for="nodeField">字段名</label><input id="nodeField" maxlength="64" placeholder="prompt / width / image"></div>
        <div class="field"><label for="nodeType">节点类型</label>
          <select id="nodeType">
            <option value="">自动推断</option>
            <option value="prompt">主提示词（接收命令 / 扩写文本）</option>
            <option value="text">可编辑配置（上传后询问修改）</option>
            <option value="default">固定默认值</option>
            <option value="image">图片（等待上传）</option>
            <option value="audio">语音（等待上传）</option>
            <option value="video">视频（等待上传）</option>
          </select>
        </div>
        <div class="field"><label for="nodeLabel">输入说明</label><input id="nodeLabel" maxlength="64" placeholder="例如：角色参考图"></div>
        <div class="field full"><label for="nodeValue">默认值 / 输入内容</label><input id="nodeValue" placeholder="留空则运行时由用户提供或等待上传"></div>
        <div class="field full"><div class="hint" id="nodeTypeHint"></div></div>
      </div>
    </div>
    <div class="dialog-foot">
      <button class="btn text" data-close="nodeDialog">取消</button>
      <button class="btn primary" id="nodeSaveBtn"><span class="icon icon-save" style="width:18px;height:18px" aria-hidden="true"></span>保存节点</button>
    </div>
  </div>
</dialog>

<dialog id="analyzeDialog">
  <div class="dialog">
    <div class="dialog-head"><h3>智能识别节点</h3><button class="icon-btn close-x" data-close="analyzeDialog"><span class="icon icon-close" style="width:18px;height:18px" aria-hidden="true"></span></button></div>
    <div class="dialog-body">
      <div class="form-grid">
        <div class="field full"><label>目标工作流</label><div class="hint" id="azWorkflowName" style="font-size:13px"></div></div>
        <div class="field"><label for="azRegion">拉取区域</label>
          <select id="azRegion"><option value="overseas">国外 runninghub.ai</option><option value="domestic">国内 runninghub.cn</option></select>
        </div>
        <div class="field"><label class="check-row"><input type="checkbox" id="azDetailed"> 详细识别全部节点</label></div>
        <div class="field full"><div class="analyze-box" id="azResult"><div class="muted">点击下方按钮拉取工作流并识别输入节点；结果不会自动保存。</div></div></div>
      </div>
    </div>
    <div class="dialog-foot" style="flex-wrap:wrap">
      <button class="btn outlined" id="azMergeBtn" hidden><span class="icon icon-plus" style="width:16px;height:16px" aria-hidden="true"></span>仅添加缺失节点</button>
      <button class="btn primary" id="azReplaceBtn" hidden><span class="icon icon-refresh" style="width:16px;height:16px" aria-hidden="true"></span>替换当前全部节点</button>
      <button class="btn primary" id="azRunBtn"><span class="icon icon-auto" style="width:16px;height:16px" aria-hidden="true"></span>开始识别</button>
    </div>
  </div>
</dialog>

<dialog id="templatePreviewDialog">
  <div class="dialog">
    <div class="dialog-head"><h3 id="templatePreviewTitle">模板预览</h3><button class="icon-btn close-x" data-close="templatePreviewDialog"><span class="icon icon-close" style="width:18px;height:18px" aria-hidden="true"></span></button></div>
    <div class="dialog-body"><textarea class="preview-text" id="templatePreviewContent" readonly></textarea></div>
    <div class="dialog-foot"><button class="btn text" data-close="templatePreviewDialog">关闭</button></div>
  </div>
</dialog>

<dialog id="confirmDialog">
  <div class="dialog">
    <div class="dialog-head"><h3 id="confirmTitle">确认操作</h3></div>
    <div class="dialog-body"><p id="confirmText" style="color:var(--muted);margin:0"></p></div>
    <div class="dialog-foot">
      <button class="btn text" id="confirmCancelBtn">取消</button>
      <button class="btn danger-text" id="confirmOkBtn">确认</button>
    </div>
  </div>
</dialog>

<div id="toasts"></div>

<script type="module">
const bridge = window.AstrBotPluginPage;

function svgIcon(name, size = 18, extra = "") {
  return `<span class="icon icon-${name}${extra ? " " + extra : ""}" style="width:${size}px;height:${size}px" aria-hidden="true"></span>`;
}

const TYPE_META = {
  prompt:  { label: "主提示词", icon: "prompt", cls: "type-prompt",  hint: "接收 /wf运行 后的描述文本或 LLM 扩写结果，每个工作流最多 1 个" },
  text:    { label: "可编辑配置", icon: "tune", cls: "type-text",   hint: "先使用默认值；上传文件后会询问用户是否修改" },
  default: { label: "固定默认值", icon: "lock", cls: "type-default", hint: "固定使用默认值，运行时不询问" },
  image:   { label: "图片", icon: "image", cls: "type-image", hint: "无默认值时按顺序等待用户上传图片" },
  audio:   { label: "语音", icon: "audio", cls: "type-audio", hint: "无默认值时按顺序等待用户上传语音" },
  video:   { label: "视频", icon: "video", cls: "type-video", hint: "无默认值时按顺序等待用户上传视频" },
  "":      { label: "自动推断", icon: "auto", cls: "type-default", hint: "按字段名自动判断：image→图片、audio/voice→语音、video→视频，其余→文字" }
};

const state = { workflows: [], templates: [], original: null, dirty: false, saving: false, loading: true, search: "", region: "all" };
let workflowDialogIndex = -1;
let nodeDialogState = { wf: -1, node: -1 };
let analyzeState = { wf: -1, nodes: [], method: "" };
let confirmResolver = null;

const $ = (id) => document.getElementById(id);

function clone(value) {
  if (typeof structuredClone === "function") return structuredClone(value);
  return JSON.parse(JSON.stringify(value));
}
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}
function normalizeApiResponse(raw) {
  // AstrBot 页面桥会把后端 { success, data } 的 data 剥掉再传给 iframe，
  // 这里统一归一化成业务数据，兼容桥已拆包和未拆包两种行为。
  if (!raw || typeof raw !== "object") return raw;
  if (raw.success === false) return raw;
  if (raw.data && typeof raw.data === "object") return raw.data;
  return raw;
}
function toast(message, type = "info", duration = 3200) {
  const el = document.createElement("div");
  el.className = `toast ${type === "ok" ? "ok" : type === "err" ? "err" : type === "warn" ? "warn" : ""}`;
  el.textContent = message;
  $("toasts").appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 220); }, duration);
}
function setDirty(dirty) {
  state.dirty = dirty;
  $("dirtyBadge").classList.toggle("show", dirty);
  $("saveBtn").disabled = state.saving || !dirty;
  $("saveBtn").textContent = dirty ? "保存配置 ●" : "保存配置";
}
function inferType(fieldName) {
  const f = String(fieldName || "").toLowerCase();
  if (/(image|pic|photo|img)/.test(f)) return "image";
  if (/(audio|voice|sound|music|speech)/.test(f)) return "audio";
  if (/(video|mp4|mov|webm|clip)/.test(f)) return "video";
  return "text";
}
function effectiveType(node) {
  if (node && node.value_type) return node.value_type;
  const auto = node && node.effective_type;
  if (auto && auto !== "text") return auto;
  if (node && node.field_name) return inferType(node.field_name);
  return "text";
}
function typeMeta(type) { return TYPE_META[type] || TYPE_META[""]; }
function valuePreview(node) {
  const v = String(node.field_value || "").trim();
  if (v) return v;
  const t = effectiveType(node);
  if (t === "prompt") return "运行时接收命令文本";
  if (t === "image" || t === "audio" || t === "video") return "等待用户上传";
  if (t === "text") return "可编辑配置（空默认值）";
  return "空默认值";
}
function normalizeNode(raw) {
  const valueType = String(raw?.value_type || "").toLowerCase();
  return {
    node_id: String(raw?.node_id || "").trim(),
    field_name: String(raw?.field_name || "prompt").trim() || "prompt",
    field_value: String(raw?.field_value || ""),
    value_type: valueType === "auto" ? "" : valueType,
    label: String(raw?.label || "").trim()
  };
}
function validateNode(raw) {
  const node = normalizeNode(raw);
  if (!node.node_id) return { ok: false, message: "节点 ID 不能为空", node };
  return { ok: true, node };
}

function filterWorkflows() {
  const q = state.search.trim().toLowerCase();
  return state.workflows
    .map((wf, index) => ({ wf, index }))
    .filter(({ wf }) => state.region === "all" || wf.region === state.region)
    .map(({ wf, index }) => {
      if (!q) return { wf, index, nodes: wf.nodes };
      const wfHit = [wf.name, wf.workflow_id].some((v) => String(v).toLowerCase().includes(q));
      const nodes = wfHit ? wf.nodes : wf.nodes.filter((node) =>
        [node.node_id, node.field_name, node.label, node.field_value, node.value_type]
          .some((v) => String(v).toLowerCase().includes(q))
      );
      return nodes.length ? { wf, index, nodes } : null;
    })
    .filter(Boolean);
}

function renderStats() {
  let nodes = 0, prompts = 0, files = 0;
  for (const wf of state.workflows) {
    nodes += wf.nodes.length;
    for (const node of wf.nodes) {
      const t = effectiveType(node);
      if (t === "prompt") prompts += 1;
      if (t === "image" || t === "audio" || t === "video") files += 1;
    }
  }
  $("statWorkflows").textContent = state.workflows.length;
  $("statNodes").textContent = nodes;
  $("statPrompts").textContent = prompts;
  $("statFiles").textContent = files;
}

function nodeRowHTML(wfIndex, nodeIndex) {
  const node = state.workflows[wfIndex].nodes[nodeIndex];
  const t = effectiveType(node);
  const meta = typeMeta(t);
  return `
    <div class="node-row" draggable="true" data-wf="${wfIndex}" data-node="${nodeIndex}">
      <span class="drag-handle" title="拖动排序">${svgIcon("drag", 14)}</span>
      <span class="type-tag ${meta.cls}">${svgIcon(meta.icon, 14)}<span>${esc(meta.label)}</span></span>
      <div class="node-core">
        <div class="node-key"><span>${esc(node.node_id)}</span><span class="sep">·</span><span class="fname">${esc(node.field_name)}</span></div>
        <div class="node-value" title="${esc(node.field_value || "")}">${esc(valuePreview(node))}</div>
      </div>
      <div class="node-label" title="${esc(node.label || "")}">${esc(node.label || "未设置说明")}</div>
      <div class="node-actions">
        <button class="icon-btn small" data-act="move-node" data-wf="${wfIndex}" data-node="${nodeIndex}" data-dir="-1" title="上移">${svgIcon("up", 15)}</button>
        <button class="icon-btn small" data-act="move-node" data-wf="${wfIndex}" data-node="${nodeIndex}" data-dir="1" title="下移">${svgIcon("up", 15, "rotate-180")}</button>
        <button class="icon-btn small" data-act="edit-node" data-wf="${wfIndex}" data-node="${nodeIndex}" title="编辑">${svgIcon("pencil", 15)}</button>
        <button class="icon-btn small danger" data-act="del-node" data-wf="${wfIndex}" data-node="${nodeIndex}" title="删除">${svgIcon("delete", 15)}</button>
      </div>
    </div>`;
}

function workflowCardHTML({ wf, index, nodes }) {
  const regionText = wf.region === "domestic" ? "国内" : "国外";
  const regionCls = wf.region === "domestic" ? "domestic" : "overseas";
  const rows = nodes.map((node) => {
    const realIndex = wf.nodes.indexOf(node);
    return nodeRowHTML(index, realIndex);
  }).join("");
  return `
    <article class="workflow-card">
      <div class="wf-head">
        <div class="wf-title">
          <h2>${esc(wf.name)}</h2>
          <span class="wf-id">${esc(wf.workflow_id)}</span>
        </div>
        <div class="wf-actions">
          <button class="btn small" data-act="analyze" data-wf="${index}" title="拉取工作流并智能识别节点">${svgIcon("auto", 14)}识别</button>
          <button class="btn small" data-act="add-node" data-wf="${index}">${svgIcon("plus", 14)}节点</button>
          <button class="icon-btn small" data-act="edit-wf" data-wf="${index}" title="编辑工作流">${svgIcon("pencil", 15)}</button>
          <button class="icon-btn small danger" data-act="del-wf" data-wf="${index}" title="删除工作流">${svgIcon("delete", 15)}</button>
        </div>
      </div>
      <div class="badges">
        <span class="badge ${regionCls}">${regionText} · runninghub.${wf.region === "domestic" ? "cn" : "ai"}</span>
        <span class="badge">⚡ ${esc(wf.instance_type)}</span>
        ${wf.llm_enhance ? '<span class="badge llm">✦ LLM 扩写</span>' : ""}
        <span class="badge">${svgIcon("tune", 12)} ${wf.nodes.length} 个节点</span>
      </div>
      <div class="node-zone">
        <div class="node-zone-head"><b>输入节点</b><span>拖动左侧把手调整顺序</span><span class="spacer"></span>${nodes.length !== wf.nodes.length ? `<span>已筛选 ${nodes.length}/${wf.nodes.length}</span>` : ""}</div>
        <div class="node-list">${rows || '<div class="node-empty">还没有输入节点，点击右上角「添加节点」</div>'}</div>
      </div>
    </article>`;
}

function render() {
  const filtered = filterWorkflows();
  renderStats();
  const grid = $("workflowGrid");
  grid.innerHTML = filtered.map(workflowCardHTML).join("");
  $("emptyState").classList.toggle("hidden", filtered.length > 0 || state.loading);
  grid.classList.toggle("hidden", filtered.length === 0);
}

function mutate(fn) {
  fn();
  setDirty(true);
  render();
}

function populateWorkflowSelect(selectedName = "") {
  const sel = $("nodeWorkflow");
  sel.innerHTML = state.workflows.map((wf) =>
    `<option value="${esc(wf.name)}"${wf.name === selectedName ? " selected" : ""}>${esc(wf.name)}</option>`
  ).join("");
}

function formatSize(size) {
  const n = Number(size || 0);
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
  return `${(n / 1024 / 1024).toFixed(2)} MB`;
}

function populateTemplateSelect(currentPath = "") {
  const sel = $("wfTemplate");
  const known = new Set(state.templates.map((t) => t.path));
  const options = ['<option value="">不使用模板</option>'];
  if (currentPath && !known.has(currentPath)) {
    options.push(`<option value="${esc(currentPath)}">${esc(currentPath)}</option>`);
  }
  for (const t of state.templates) {
    options.push(`<option value="${esc(t.path)}">${esc(t.path)} · ${formatSize(t.size)}</option>`);
  }
  sel.innerHTML = options.join("");
  updateTemplateHint();
}

function updateTemplateHint() {
  const path = $("wfTemplate").value;
  const t = state.templates.find((item) => item.path === path);
  const hint = $("wfTemplateHint");
  if (!path) hint.textContent = "未选择模板；模板存放在插件 prompt/ 目录。";
  else if (t) hint.textContent = `${t.name} · ${formatSize(t.size)}`;
  else hint.textContent = `自定义路径：${path}`;
}

async function loadTemplates() {
  try {
    const res = normalizeApiResponse(await bridge.apiGet("page/prompt-templates"));
    if (res && res.success !== false) {
      const list = Array.isArray(res.templates) ? clone(res.templates) : [];
      if (list.length) state.templates = list;
    }
  } catch (err) {
    // page/config 已附带模板列表，这里刷新失败时保留已有数据即可。
    console.warn("读取模板列表失败：", err);
  }
}

async function uploadTemplate(file) {
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) {
    toast("模板文件不能超过 2MB", "err");
    return;
  }
  try {
    let res;
    try {
      res = await bridge.upload("page/prompt-templates", file);
    } catch (uploadErr) {
      // bridge.upload 在部分 AstrBot 版本 / 网络环境下会抛 NetworkError，
      // 这里退化为 JSON 上传，后端同样支持。
      console.warn("bridge.upload failed, fallback to JSON upload:", uploadErr);
      const content = await file.text();
      res = await bridge.apiPost("page/prompt-templates", {
        filename: file.name,
        content,
      });
    }
    res = normalizeApiResponse(res);
    if (!res || res.success === false) throw new Error(res?.message || "上传失败");
    await loadTemplates();
    const path = res.path || res.data?.path || "";
    populateTemplateSelect(path || `prompt/${file.name}`);
    toast(res.message || "模板已上传", "ok");
  } catch (err) {
    toast(`上传失败：${err?.message || err}`, "err", 5200);
  }
}

async function previewSelectedTemplate() {
  const path = $("wfTemplate").value;
  if (!path) {
    toast("请先选择一个模板", "warn");
    return;
  }
  try {
    const res = normalizeApiResponse(await bridge.apiGet("page/prompt-template", { name: path }));
    if (!res || res.success === false) throw new Error(res?.message || "读取模板失败");
    const content = res.content || res.data?.content || "";
    if (!content) throw new Error("模板内容为空");
    $("templatePreviewTitle").textContent = path;
    $("templatePreviewContent").value = content;
    $("templatePreviewDialog").showModal();
  } catch (err) {
    toast(`预览失败：${err?.message || err}`, "err", 5200);
  }
}

function openWorkflowDialog(index) {
  workflowDialogIndex = index;
  const wf = index >= 0 ? state.workflows[index] : null;
  $("workflowDialogTitle").textContent = wf ? "编辑工作流" : "新建工作流";
  $("wfName").value = wf?.name || "";
  $("wfId").value = wf?.workflow_id || "";
  $("wfInstance").value = wf?.instance_type || "Standard";
  $("wfRegion").value = wf?.region || "overseas";
  $("wfEnhance").checked = Boolean(wf?.llm_enhance);
  populateTemplateSelect(wf?.llm_template_path || "");
  $("workflowDialog").showModal();
}

function saveWorkflowFromDialog() {
  const name = $("wfName").value.trim();
  const workflowId = $("wfId").value.trim();
  if (!name) return toast("请填写工作流名称", "err");
  if (!workflowId) return toast("请填写工作流 ID", "err");
  const duplicate = state.workflows.findIndex((wf, i) => wf.name === name && i !== workflowDialogIndex);
  if (duplicate >= 0) return toast(`工作流名称「${name}」已存在`, "err");
  const data = {
    name,
    workflow_id: workflowId,
    instance_type: $("wfInstance").value,
    region: $("wfRegion").value,
    llm_enhance: $("wfEnhance").checked,
    llm_template_path: $("wfTemplate").value.trim(),
    nodes: workflowDialogIndex >= 0 ? clone(state.workflows[workflowDialogIndex].nodes) : []
  };
  mutate(() => {
    if (workflowDialogIndex >= 0) state.workflows[workflowDialogIndex] = data;
    else state.workflows.push(data);
  });
  $("workflowDialog").close();
  toast(workflowDialogIndex >= 0 ? "工作流已更新（记得保存）" : "工作流已添加（记得保存）", "ok");
}

function updateNodeTypeHint() {
  const valueType = $("nodeType").value;
  const fieldName = $("nodeField").value.trim();
  const hint = $("nodeTypeHint");
  if (valueType) hint.textContent = typeMeta(valueType).hint;
  else hint.textContent = `自动推断：字段名「${fieldName || "空"}」将按 ${inferType(fieldName || "prompt")} 处理。`;
}

function openNodeDialog(wfIndex, nodeIndex) {
  nodeDialogState = { wf: wfIndex, node: nodeIndex };
  const node = nodeIndex >= 0 ? state.workflows[wfIndex].nodes[nodeIndex] : null;
  populateWorkflowSelect(state.workflows[wfIndex].name);
  $("nodeWorkflow").disabled = nodeIndex >= 0;
  $("nodeDialogTitle").textContent = node ? "编辑输入节点" : "添加输入节点";
  $("nodeId").value = node?.node_id || "";
  $("nodeField").value = node?.field_name || "prompt";
  $("nodeValue").value = node?.field_value || "";
  $("nodeType").value = node?.value_type || "";
  $("nodeLabel").value = node?.label || "";
  updateNodeTypeHint();
  $("nodeDialog").showModal();
}

function saveNodeFromDialog() {
  const check = validateNode({
    node_id: $("nodeId").value,
    field_name: $("nodeField").value,
    field_value: $("nodeValue").value,
    value_type: $("nodeType").value,
    label: $("nodeLabel").value
  });
  if (!check.ok) return toast(check.message, "err");
  const targetName = $("nodeWorkflow").value;
  let wfIndex = state.workflows.findIndex((wf) => wf.name === targetName);
  if (wfIndex < 0) wfIndex = nodeDialogState.wf;
  if (wfIndex < 0) return toast("请先创建或选择工作流", "err");
  const wf = state.workflows[wfIndex];
  const node = check.node;
  const duplicate = wf.nodes.findIndex((n, i) =>
    n.node_id === node.node_id && n.field_name === node.field_name && i !== nodeDialogState.node
  );
  if (duplicate >= 0) return toast(`节点 ${node.node_id}/${node.field_name} 已存在`, "err");
  if (node.value_type === "prompt") {
    const promptIndex = wf.nodes.findIndex((n, i) =>
      i !== nodeDialogState.node && effectiveType(n) === "prompt" && String(n.value_type || "") === "prompt"
    );
    if (promptIndex >= 0) return toast("该工作流已有主提示词节点，最多 1 个", "err");
  }
  mutate(() => {
    if (nodeDialogState.node >= 0) wf.nodes[nodeDialogState.node] = node;
    else wf.nodes.push(node);
  });
  $("nodeDialog").close();
  toast(nodeDialogState.node >= 0 ? "节点已更新" : "节点已添加", "ok");
}

function askConfirm(title, text, okLabel = "确认") {
  $("confirmTitle").textContent = title;
  $("confirmText").textContent = text;
  $("confirmOkBtn").textContent = okLabel;
  $("confirmDialog").showModal();
  return new Promise((resolve) => { confirmResolver = resolve; });
}

async function loadConfig() {
  state.loading = true;
  render();
  const res = normalizeApiResponse(await bridge.apiGet("page/config"));
  if (!res || res.success === false) throw new Error(res?.message || "读取配置失败");
  const data = res;
  state.workflows = Array.isArray(data.workflows) ? clone(data.workflows) : [];
  if (Array.isArray(data.prompt_templates)) state.templates = clone(data.prompt_templates);
  state.original = clone(state.workflows);
  state.loading = false;
  setDirty(false);
  render();
  $("pluginMeta").textContent = data.plugin_name || "runninghub_workflow_adapter";
}

async function saveConfig() {
  if (state.saving) return;
  state.saving = true;
  $("saveBtn").disabled = true;
  $("saveBtn").textContent = "保存中…";
  try {
    const res = normalizeApiResponse(await bridge.apiPost("page/config", { workflows: state.workflows }));
    if (!res || res.success === false) throw new Error(res?.message || "保存失败");
    state.original = clone(state.workflows);
    setDirty(false);
    toast(res.message || `已保存 ${res.workflow_nodes || 0} 个节点`, "ok");
  } catch (err) {
    toast(String(err?.message || err), "err", 5000);
  } finally {
    state.saving = false;
    setDirty(state.dirty);
  }
}

async function runAnalyze() {
  const wfIndex = analyzeState.wf;
  if (wfIndex < 0) return;
  const wf = state.workflows[wfIndex];
  const btn = $("azRunBtn");
  btn.disabled = true;
  btn.textContent = "识别中…";
  try {
    const res = normalizeApiResponse(await bridge.apiPost("page/analyze", {
      workflow_id: wf.workflow_id,
      region: $("azRegion").value,
      detailed: $("azDetailed").checked
    }));
    if (!res || res.success === false) throw new Error(res?.message || "识别失败");
    analyzeState.nodes = (res.nodes || []).map(normalizeNode).filter((n) => n.node_id);
    analyzeState.method = res.method || "";
    $("azResult").innerHTML = analyzeState.nodes.length
      ? `<div class="muted" style="margin-bottom:8px">识别方式：${esc(analyzeState.method)} · 共 ${analyzeState.nodes.length} 个节点</div>` +
        analyzeState.nodes.map((n) =>
          `<span class="node-chip">${esc(n.node_id)} · ${esc(n.field_name)} · ${esc(typeMeta(effectiveType(n)).label)}${n.label ? ` · ${esc(n.label)}` : ""}</span>`
        ).join("")
      : '<div class="muted">没有识别到可编辑输入节点。</div>';
    $("azReplaceBtn").hidden = analyzeState.nodes.length === 0;
    $("azMergeBtn").hidden = analyzeState.nodes.length === 0;
    toast(`识别完成：${analyzeState.nodes.length} 个节点`, "ok");
  } catch (err) {
    $("azResult").innerHTML = `<div class="muted" style="color:var(--danger)">${esc(String(err?.message || err))}</div>`;
    $("azReplaceBtn").hidden = true;
    $("azMergeBtn").hidden = true;
    toast(String(err?.message || err), "err", 5000);
  } finally {
    btn.disabled = false;
    btn.textContent = "开始识别";
  }
}

function applyAnalyze(mode) {
  const wf = state.workflows[analyzeState.wf];
  if (!wf || !analyzeState.nodes.length) return;
  mutate(() => {
    if (mode === "replace") {
      wf.nodes = clone(analyzeState.nodes);
    } else {
      for (const node of analyzeState.nodes) {
        const index = wf.nodes.findIndex((n) => n.node_id === node.node_id && n.field_name === node.field_name);
        if (index >= 0) wf.nodes[index] = node;
        else wf.nodes.push(node);
      }
    }
  });
  $("analyzeDialog").close();
  toast(mode === "replace" ? "已替换为识别结果" : "已合并识别结果", "ok");
}

function openAnalyzeDialog(wfIndex) {
  const wf = state.workflows[wfIndex];
  if (!wf) return;
  analyzeState = { wf: wfIndex, nodes: [], method: "" };
  $("azWorkflowName").textContent = `${wf.name} · ${wf.workflow_id}`;
  $("azRegion").value = wf.region === "domestic" ? "domestic" : "overseas";
  $("azDetailed").checked = false;
  $("azResult").innerHTML = '<div class="muted">点击下方按钮拉取工作流并识别输入节点；结果不会自动保存。</div>';
  $("azReplaceBtn").hidden = true;
  $("azMergeBtn").hidden = true;
  $("azRunBtn").disabled = false;
  $("azRunBtn").textContent = "开始识别";
  $("analyzeDialog").showModal();
}

document.addEventListener("click", async (event) => {
  const closeTarget = event.target.closest("[data-close]");
  if (closeTarget) {
    const dlg = $(closeTarget.dataset.close);
    if (dlg) dlg.close();
    return;
  }
  const button = event.target.closest("[data-act]");
  if (!button) return;
  const act = button.dataset.act;
  const wfIndex = Number(button.dataset.wf || -1);
  const nodeIndex = Number(button.dataset.node || -1);

  if (act === "add-wf") openWorkflowDialog(-1);
  else if (act === "edit-wf") openWorkflowDialog(wfIndex);
  else if (act === "del-wf") {
    const wf = state.workflows[wfIndex];
    if (!wf) return;
    const ok = await askConfirm("删除工作流", `确定删除「${wf.name}」及其 ${wf.nodes.length} 个输入节点吗？`, "删除");
    if (!ok) return;
    mutate(() => state.workflows.splice(wfIndex, 1));
    toast("工作流已删除（记得保存）", "warn");
  }
  else if (act === "add-node") openNodeDialog(wfIndex, -1);
  else if (act === "edit-node") openNodeDialog(wfIndex, nodeIndex);
  else if (act === "del-node") {
    const wf = state.workflows[wfIndex];
    const node = wf?.nodes[nodeIndex];
    if (!node) return;
    const ok = await askConfirm("删除节点", `确定删除节点 ${node.node_id}/${node.field_name} 吗？`, "删除");
    if (!ok) return;
    mutate(() => wf.nodes.splice(nodeIndex, 1));
    toast("节点已删除（记得保存）", "warn");
  }
  else if (act === "move-node") {
    const dir = Number(button.dataset.dir || 0);
    const wf = state.workflows[wfIndex];
    const target = nodeIndex + dir;
    if (!wf || target < 0 || target >= wf.nodes.length) return;
    mutate(() => { const [n] = wf.nodes.splice(nodeIndex, 1); wf.nodes.splice(target, 0, n); });
  }
  else if (act === "analyze") openAnalyzeDialog(wfIndex);
});

let drag = null;
document.addEventListener("dragstart", (event) => {
  const row = event.target.closest(".node-row");
  if (!row) return;
  drag = { wf: Number(row.dataset.wf), node: Number(row.dataset.node) };
  event.dataTransfer.effectAllowed = "move";
  try { event.dataTransfer.setData("text/plain", ""); } catch {}
  requestAnimationFrame(() => row.classList.add("dragging"));
});
document.addEventListener("dragover", (event) => {
  if (!drag) return;
  const row = event.target.closest(".node-row");
  if (!row) return;
  event.preventDefault();
  const rect = row.getBoundingClientRect();
  const before = event.clientY < rect.top + rect.height / 2;
  row.classList.toggle("drop-before", before);
  row.classList.toggle("drop-after", !before);
});
document.addEventListener("drop", (event) => {
  if (!drag) return;
  const row = event.target.closest(".node-row");
  if (!row) return;
  event.preventDefault();
  const toWf = Number(row.dataset.wf);
  const toNode = Number(row.dataset.node);
  const rect = row.getBoundingClientRect();
  const before = event.clientY < rect.top + rect.height / 2;
  row.classList.remove("drop-before", "drop-after");
  mutate(() => {
    const fromWf = state.workflows[drag.wf];
    if (!fromWf) return;
    const [moved] = fromWf.nodes.splice(drag.node, 1);
    let target = toNode;
    if (drag.wf === toWf && drag.node < toNode) target -= 1;
    if (!before) target += 1;
    const dest = state.workflows[toWf];
    if (!dest) { fromWf.nodes.splice(Math.min(drag.node, fromWf.nodes.length), 0, moved); return; }
    dest.nodes.splice(Math.max(0, Math.min(target, dest.nodes.length)), 0, moved);
  });
  drag = null;
});
document.addEventListener("dragend", () => {
  if (!drag) return;
  document.querySelectorAll(".node-row").forEach((row) => {
    row.classList.remove("dragging", "drop-before", "drop-after");
  });
  drag = null;
});

$("workflowSaveBtn").addEventListener("click", saveWorkflowFromDialog);
$("nodeSaveBtn").addEventListener("click", saveNodeFromDialog);
$("azRunBtn").addEventListener("click", runAnalyze);
$("azReplaceBtn").addEventListener("click", () => applyAnalyze("replace"));
$("azMergeBtn").addEventListener("click", () => applyAnalyze("merge"));
$("addWorkflowBtn").addEventListener("click", () => openWorkflowDialog(-1));
$("refreshBtn").addEventListener("click", async () => {
  try { await loadConfig(); toast("配置已刷新", "ok"); }
  catch (err) { toast(String(err?.message || err), "err"); }
});
$("saveBtn").addEventListener("click", saveConfig);
$("wfUploadBtn").addEventListener("click", () => $("wfTemplateFile").click());
$("wfTemplateFile").addEventListener("change", (event) => {
  uploadTemplate(event.target.files?.[0] || null);
  event.target.value = "";
});
$("wfPreviewBtn").addEventListener("click", previewSelectedTemplate);
$("wfTemplate").addEventListener("change", updateTemplateHint);
$("searchInput").addEventListener("input", (event) => { state.search = event.target.value; render(); });
$("regionFilter").addEventListener("change", (event) => { state.region = event.target.value; render(); });
$("nodeType").addEventListener("change", updateNodeTypeHint);
$("nodeField").addEventListener("input", updateNodeTypeHint);
$("confirmOkBtn").addEventListener("click", () => { $("confirmDialog").close(); if (confirmResolver) confirmResolver(true); confirmResolver = null; });
$("confirmCancelBtn").addEventListener("click", () => { $("confirmDialog").close(); if (confirmResolver) confirmResolver(false); confirmResolver = null; });

document.addEventListener("keydown", (event) => {
  if ((event.ctrlKey || event.metaKey) && String(event.key).toLowerCase() === "s") {
    event.preventDefault();
    if (!state.dirty) toast("当前没有未保存的修改", "info", 1800);
    else saveConfig();
  }
});
window.addEventListener("beforeunload", (event) => {
  if (state.dirty) { event.preventDefault(); event.returnValue = ""; }
});

async function init() {
  try {
    if (!bridge || typeof bridge.ready !== "function") throw new Error("未检测到 AstrBot Plugin Page Bridge，请从 AstrBot WebUI 的插件页面入口打开本页面。");
    const context = await bridge.ready();
    $("pluginMeta").textContent = context?.displayName || context?.pluginName || "runninghub_workflow_adapter";
    await Promise.all([loadConfig(), loadTemplates()]);
    toast("已连接插件并读取配置", "ok", 2200);
  } catch (err) {
    state.loading = false;
    render();
    toast(String(err?.message || err), "err", 8000);
  }
}
init();
</script>
</body>
</html>
