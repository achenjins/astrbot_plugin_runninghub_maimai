<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>工作流节点配置</title>
<style>
*{box-sizing:border-box}
.hidden{display:none!important}
:root{
  --bg:#f4f6fb;--panel:#ffffff;--panel-soft:#f8fafd;--text:#1b2333;--muted:#69748c;
  --line:#e6eaf3;--line-strong:#d6dcec;--accent:#5468ff;--accent-2:#8b5cf6;
  --ok:#0ea36e;--warn:#d97706;--danger:#e5484d;--shadow:0 1px 2px rgba(23,32,51,.05),0 10px 30px rgba(23,32,51,.07);
  --shadow-lg:0 18px 50px rgba(15,23,42,.18);--radius:18px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1017;--panel:#151923;--panel-soft:#1b202d;--text:#edf1f9;--muted:#97a0b5;
    --line:#252c3d;--line-strong:#323b50;--accent:#7b8aff;--accent-2:#a78bfa;
    --ok:#34d399;--warn:#fbbf24;--danger:#f87171;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.35);
    --shadow-lg:0 22px 60px rgba(0,0,0,.5);
  }
}
html,body{height:100%}
body{
  margin:0;background:
    radial-gradient(1100px 420px at 82% -10%,rgba(84,104,255,.10),transparent 62%),
    radial-gradient(900px 380px at -8% 8%,rgba(139,92,246,.09),transparent 60%),
    var(--bg);
  color:var(--text);font:14px/1.55 ui-sans-serif,system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.48;cursor:not-allowed}
input,select,textarea{
  font:inherit;color:var(--text);background:var(--panel-soft);border:1px solid var(--line-strong);
  border-radius:11px;padding:9px 11px;outline:none;transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(84,104,255,.14)}
textarea{resize:vertical;min-height:68px}
.app{max-width:1440px;margin:0 auto;padding:22px 24px 64px}
.topbar{
  position:sticky;top:12px;z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 16px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.82);
  box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
@media (prefers-color-scheme: dark){.topbar{background:rgba(21,25,35,.82)}}
.brand{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.logo-mark{
  width:42px;height:42px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:20px;
  box-shadow:0 8px 22px rgba(84,104,255,.32);
}
.brand h1{margin:0;font-size:17px;letter-spacing:.2px}
.brand .sub{margin:0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line-strong);background:var(--panel);color:var(--text);
  padding:8px 13px;border-radius:11px;display:inline-flex;align-items:center;gap:6px;
  transition:transform .12s,box-shadow .12s,border-color .12s,background .12s;font-weight:600;font-size:13px;
}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(84,104,255,.28)}
.btn.danger{color:var(--danger);border-color:rgba(229,72,77,.3)}
.btn.danger:hover:not(:disabled){background:rgba(229,72,77,.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){background:var(--panel-soft);color:var(--text)}
.btn.small{padding:5px 8px;font-size:12px;border-radius:9px}
.icon-btn{
  width:30px;height:30px;display:inline-grid;place-items:center;border-radius:9px;border:1px solid transparent;
  background:transparent;color:var(--muted);transition:.15s;
}
.icon-btn:hover{background:var(--panel-soft);color:var(--text);border-color:var(--line)}
.icon-btn.danger:hover{background:rgba(229,72,77,.1);color:var(--danger)}
.icon-btn[disabled]{opacity:.3;cursor:not-allowed}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}
.stat-card{
  padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);
  display:flex;align-items:center;gap:12px;transition:transform .15s;
}
.stat-card:hover{transform:translateY(-2px)}
.stat-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.stat-icon.blue{background:rgba(84,104,255,.12);color:var(--accent)}
.stat-icon.purple{background:rgba(139,92,246,.12);color:var(--accent-2)}
.stat-icon.green{background:rgba(14,163,110,.12);color:var(--ok)}
.stat-icon.amber{background:rgba(217,119,6,.12);color:var(--warn)}
.stat-body b{font-size:21px;line-height:1.1;display:block}
.stat-body span{color:var(--muted);font-size:12px}
.toolbar{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:220px;max-width:430px}
.search-wrap input{width:100%;padding-left:34px}
.search-wrap .search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.dirty-badge{
  font-size:12px;font-weight:700;color:var(--warn);border:1px solid rgba(217,119,6,.35);background:rgba(217,119,6,.1);
  padding:5px 10px;border-radius:999px;opacity:0;transform:translateY(2px);transition:.18s;pointer-events:none;
}
.dirty-badge.show{opacity:1;transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:16px;align-items:start}
@media (max-width:560px){.grid{grid-template-columns:1fr}.app{padding:14px 12px 50px}.brand .sub{display:none}}
.workflow-card{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);
  overflow:hidden;animation:rise .22s ease both;content-visibility:auto;contain-intrinsic-size:auto 220px;
}
.workflow-card:nth-child(2){animation-delay:.02s}.workflow-card:nth-child(3){animation-delay:.04s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wf-head{display:flex;gap:10px;align-items:flex-start;padding:15px 16px 11px}
.wf-title{min-width:0;flex:1}
.wf-title h2{margin:0;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wf-title .wf-id{color:var(--muted);font-family:ui-monospace,Consolas,monospace;font-size:12px;font-weight:500;word-break:break-all}
.wf-actions{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.badges{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;
  border:1px solid var(--line-strong);background:var(--panel-soft);color:var(--muted);
}
.badge.overseas{color:#2563eb;border-color:rgba(37,99,235,.25);background:rgba(37,99,235,.08)}
.badge.domestic{color:#0d9488;border-color:rgba(13,148,136,.25);background:rgba(13,148,136,.08)}
.badge.llm{color:var(--accent-2);border-color:rgba(139,92,246,.3);background:rgba(139,92,246,.1)}
.node-zone{border-top:1px solid var(--line);padding:12px 16px 16px}
.node-zone-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;color:var(--muted);font-size:12px}
.node-zone-head b{color:var(--text)}
.node-zone-head .spacer{flex:1}
.node-list{display:flex;flex-direction:column;gap:7px;min-height:42px}
.node-empty{
  border:1px dashed var(--line-strong);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:12px;
}
.node-row{
  display:grid;grid-template-columns:14px auto minmax(0,1fr) auto auto;align-items:center;gap:9px;
  border:1px solid var(--line);border-radius:13px;padding:9px 10px;background:var(--panel-soft);
  transition:border-color .14s,box-shadow .14s,transform .14s,opacity .14s;
}
.node-row:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.node-row.dragging{opacity:.45;transform:scale(.99)}
.node-row.drop-before{box-shadow:inset 0 3px 0 var(--accent);border-color:var(--accent)}
.node-row.drop-after{box-shadow:inset 0 -3px 0 var(--accent);border-color:var(--accent)}
.drag-handle{cursor:grab;color:var(--muted);font-size:13px;letter-spacing:-2px;user-select:none;padding:0 2px}
.drag-handle:active{cursor:grabbing}
.type-pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;
  white-space:nowrap;border:1px solid;
}
.type-prompt{color:#7c3aed;background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.28)}
.type-text{color:#2563eb;background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.26)}
.type-default{color:#64748b;background:rgba(100,116,139,.1);border-color:rgba(100,116,139,.26)}
.type-image{color:#0d9488;background:rgba(20,184,166,.1);border-color:rgba(20,184,166,.26)}
.type-audio{color:#d97706;background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.28)}
.type-video{color:#db2777;background:rgba(236,72,153,.1);border-color:rgba(236,72,153,.26)}
@media (prefers-color-scheme: dark){
  .type-prompt{color:#c4b5fd;background:rgba(139,92,246,.16);border-color:rgba(139,92,246,.35)}
  .type-text{color:#93c5fd;background:rgba(59,130,246,.16);border-color:rgba(59,130,246,.35)}
  .type-default{color:#cbd5e1;background:rgba(148,163,184,.12);border-color:rgba(148,163,184,.28)}
  .type-image{color:#5eead4;background:rgba(20,184,166,.14);border-color:rgba(20,184,166,.32)}
  .type-audio{color:#fcd34d;background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.32)}
  .type-video{color:#f9a8d4;background:rgba(236,72,153,.14);border-color:rgba(236,72,153,.32)}
}
.node-core{min-width:0}
.node-key{display:flex;align-items:baseline;gap:4px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;font-weight:700}
.node-key .sep{color:var(--muted);font-weight:400}
.node-key .fname{color:var(--accent)}
.node-value{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}
.node-label{font-size:12px;color:var(--muted);max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-actions{display:flex;align-items:center;gap:1px}
.empty{
  border:1px dashed var(--line-strong);border-radius:20px;padding:70px 20px;text-align:center;color:var(--muted);background:rgba(255,255,255,.35);
}
@media (prefers-color-scheme: dark){.empty{background:rgba(21,25,35,.35)}}
.empty .big{font-size:40px;margin-bottom:10px}
.empty h3{margin:0 0 6px;color:var(--text);font-size:17px}
dialog{
  border:0;padding:0;border-radius:20px;background:var(--panel);color:var(--text);box-shadow:var(--shadow-lg);
  width:min(560px,calc(100vw - 28px));max-height:min(86vh,820px);
}
dialog::backdrop{background:rgba(8,10,16,.5);backdrop-filter:blur(3px)}
.dialog{display:flex;flex-direction:column;max-height:min(86vh,820px)}
.dialog-head{display:flex;align-items:center;gap:10px;padding:18px 20px 12px}
.dialog-head h3{margin:0;font-size:16px}
.dialog-head .close-x{margin-left:auto}
.dialog-body{padding:4px 20px 20px;overflow:auto}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.field .hint{font-size:11.5px;color:var(--muted)}
.field .hint.warn{color:var(--warn)}
.check-row{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel-soft)}
.check-row input{width:auto;accent-color:var(--accent)}
.dialog-foot{display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--line)}
.analyze-box{border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--panel-soft);min-height:86px}
.analyze-box .node-chip{
  display:inline-flex;align-items:center;gap:6px;margin:0 6px 6px 0;padding:5px 9px;border-radius:9px;
  border:1px solid var(--line-strong);background:var(--panel);font-size:12px;
}
.analyze-box .muted{color:var(--muted);font-size:12px}
#toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{
  min-width:220px;max-width:360px;padding:11px 14px;border-radius:13px;background:var(--panel);border:1px solid var(--line-strong);
  box-shadow:var(--shadow-lg);font-size:13px;font-weight:600;display:flex;gap:8px;align-items:flex-start;animation:toast-in .2s ease both;
}
.toast.ok{border-color:rgba(14,163,110,.35)}.toast.err{border-color:rgba(229,72,77,.4)}.toast.warn{border-color:rgba(217,119,6,.4)}
@keyframes toast-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateY(6px);transition:.18s}
@media (max-width:560px){
  .node-row{grid-template-columns:12px auto minmax(0,1fr) auto}
  .node-label{display:none}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  dialog{width:calc(100vw - 20px)}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo-mark">✦</div>
      <div>
        <h1>工作流输入节点</h1>
        <p class="sub" id="pluginMeta">runninghub_workflow_adapter</p>
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="refreshBtn" title="重新读取配置">↻ 刷新</button>
      <button class="btn" id="addWorkflowBtn">＋ 新建工作流</button>
      <button class="btn primary" id="saveBtn" disabled>保存配置</button>
    </div>
  </header>

  <section class="stat-grid" id="statGrid">
    <div class="stat-card"><div class="stat-icon blue">🧭</div><div class="stat-body"><b id="statWorkflows">0</b><span>工作流</span></div></div>
    <div class="stat-card"><div class="stat-icon purple">🧩</div><div class="stat-body"><b id="statNodes">0</b><span>输入节点</span></div></div>
    <div class="stat-card"><div class="stat-icon green">✎</div><div class="stat-body"><b id="statPrompts">0</b><span>主提示词</span></div></div>
    <div class="stat-card"><div class="stat-icon amber">📎</div><div class="stat-body"><b id="statFiles">0</b><span>图片 / 语音 / 视频</span></div></div>
  </section>

  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="searchInput" type="search" placeholder="搜索工作流名称、ID 或节点字段…" autocomplete="off">
    </div>
    <select id="regionFilter" aria-label="按区域筛选">
      <option value="all">全部区域</option>
      <option value="overseas">国外 runninghub.ai</option>
      <option value="domestic">国内 runninghub.cn</option>
    </select>
    <span class="dirty-badge" id="dirtyBadge">● 未保存</span>
  </div>

  <main class="grid" id="workflowGrid"></main>
  <div class="empty hidden" id="emptyState">
    <div class="big">🎛️</div>
    <h3>还没有工作流</h3>
    <p>点击右上角「新建工作流」，或回到聊天窗口发送 <code>/wf国外工作流 工作流ID 名称</code> 自动识别。</p>
  </div>
</div>

<dialog id="workflowDialog">
  <div class="dialog">
    <div class="dialog-head"><h3 id="workflowDialogTitle">新建工作流</h3><button class="icon-btn close-x" data-close="workflowDialog">✕</button></div>
    <div class="dialog-body">
      <div class="form-grid">
        <div class="field full"><label for="wfName">工作流名称 *</label><input id="wfName" maxlength="64" placeholder="例如：动漫生图"></div>
        <div class="field full"><label for="wfId">工作流 ID *</label><input id="wfId" maxlength="64" placeholder="例如：2087492768787685378"></div>
        <div class="field"><label for="wfInstance">设备类型</label>
          <select id="wfInstance"><option value="Standard">Standard</option><option value="Plus">Plus</option><option value="Ultra">Ultra</option></select>
        </div>
        <div class="field"><label for="wfRegion">区域</label>
          <select id="wfRegion"><option value="overseas">国外 runninghub.ai</option><option value="domestic">国内 runninghub.cn</option></select>
        </div>
        <div class="field full"><label for="wfTemplate">LLM 扩写模板路径（相对插件目录，可选）</label><input id="wfTemplate" placeholder="templates/my_template.txt"></div>
        <div class="field full"><label class="check-row"><input type="checkbox" id="wfEnhance"> 启用 LLM 提示词扩写</label></div>
      </div>
    </div>
    <div class="dialog-foot">
      <button class="btn ghost" data-close="workflowDialog">取消</button>
      <button class="btn primary" id="workflowSaveBtn">保存工作流</button>
    </div>
  </div>
</dialog>

<dialog id="nodeDialog">
  <div class="dialog">
    <div class="dialog-head"><h3 id="nodeDialogTitle">添加输入节点</h3><button class="icon-btn close-x" data-close="nodeDialog">✕</button></div>
    <div class="dialog-body">
      <div class="form-grid">
        <div class="field full"><label for="nodeWorkflow">所属工作流</label><select id="nodeWorkflow"></select></div>
        <div class="field"><label for="nodeId">节点 ID *</label><input id="nodeId" maxlength="32" placeholder="例如：353"></div>
        <div class="field"><label for="nodeField">字段名</label><input id="nodeField" maxlength="64" placeholder="prompt / width / image"></div>
        <div class="field"><label for="nodeType">节点类型</label>
          <select id="nodeType">
            <option value="">自动推断</option>
            <option value="prompt">主提示词（接收命令 / 扩写文本）</option>
            <option value="text">可编辑配置（上传后询问修改）</option>
            <option value="default">固定默认值</option>
            <option value="image">图片（等待上传）</option>
            <option value="audio">语音（等待上传）</option>
            <option value="video">视频（等待上传）</option>
          </select>
        </div>
        <div class="field"><label for="nodeLabel">输入说明</label><input id="nodeLabel" maxlength="64" placeholder="例如：角色参考图"></div>
        <div class="field full"><label for="nodeValue">默认值 / 输入内容</label><input id="nodeValue" placeholder="留空则运行时由用户提供或等待上传"></div>
        <div class="field full"><div class="hint" id="nodeTypeHint"></div></div>
      </div>
    </div>
    <div class="dialog-foot">
      <button class="btn ghost" data-close="nodeDialog">取消</button>
      <button class="btn primary" id="nodeSaveBtn">保存节点</button>
    </div>
  </div>
</dialog>

<dialog id="analyzeDialog">
  <div class="dialog">
    <div class="dialog-head"><h3>智能识别节点</h3><button class="icon-btn close-x" data-close="analyzeDialog">✕</button></div>
    <div class="dialog-body">
      <div class="form-grid">
        <div class="field full"><label>目标工作流</label><div class="hint" id="azWorkflowName" style="font-size:13px"></div></div>
        <div class="field"><label for="azRegion">拉取区域</label>
          <select id="azRegion"><option value="overseas">国外 runninghub.ai</option><option value="domestic">国内 runninghub.cn</option></select>
        </div>
        <div class="field"><label class="check-row"><input type="checkbox" id="azDetailed"> 详细识别全部节点</label></div>
        <div class="field full"><div class="analyze-box" id="azResult"><div class="muted">点击下方按钮拉取工作流并识别输入节点；结果不会自动保存。</div></div></div>
      </div>
    </div>
    <div class="dialog-foot" style="flex-wrap:wrap">
      <button class="btn" id="azMergeBtn" hidden>＋ 仅添加缺失节点</button>
      <button class="btn primary" id="azReplaceBtn" hidden>⇄ 替换当前全部节点</button>
      <button class="btn primary" id="azRunBtn">✨ 开始识别</button>
    </div>
  </div>
</dialog>

<dialog id="confirmDialog">
  <div class="dialog">
    <div class="dialog-head"><h3 id="confirmTitle">确认操作</h3></div>
    <div class="dialog-body"><p id="confirmText" style="color:var(--muted);margin:0"></p></div>
    <div class="dialog-foot">
      <button class="btn ghost" id="confirmCancelBtn">取消</button>
      <button class="btn danger" id="confirmOkBtn">确认</button>
    </div>
  </div>
</dialog>

<div id="toasts"></div>

<script type="module">
const bridge = window.AstrBotPluginPage;

const TYPE_META = {
  prompt:  { label: "主提示词", icon: "✎", cls: "type-prompt",  hint: "接收 /wf运行 后的描述文本或 LLM 扩写结果，每个工作流最多 1 个" },
  text:    { label: "可编辑配置", icon: "⚙", cls: "type-text",   hint: "先使用默认值；上传文件后会询问用户是否修改" },
  default: { label: "固定默认值", icon: "▣", cls: "type-default", hint: "固定使用默认值，运行时不询问" },
  image:   { label: "图片", icon: "🖼", cls: "type-image", hint: "无默认值时按顺序等待用户上传图片" },
  audio:   { label: "语音", icon: "🎙", cls: "type-audio", hint: "无默认值时按顺序等待用户上传语音" },
  video:   { label: "视频", icon: "🎬", cls: "type-video", hint: "无默认值时按顺序等待用户上传视频" },
  "":      { label: "自动推断", icon: "✦", cls: "type-default", hint: "按字段名自动判断：image→图片、audio/voice→语音、video→视频，其余→文字" }
};

const state = { workflows: [], original: null, dirty: false, saving: false, loading: true, search: "", region: "all" };
let workflowDialogIndex = -1;
let nodeDialogState = { wf: -1, node: -1 };
let analyzeState = { wf: -1, nodes: [], method: "" };
let confirmResolver = null;

const $ = (id) => document.getElementById(id);

function clone(value) {
  if (typeof structuredClone === "function") return structuredClone(value);
  return JSON.parse(JSON.stringify(value));
}
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}
function toast(message, type = "info", duration = 3200) {
  const el = document.createElement("div");
  el.className = `toast ${type === "ok" ? "ok" : type === "err" ? "err" : type === "warn" ? "warn" : ""}`;
  el.textContent = message;
  $("toasts").appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 220); }, duration);
}
function setDirty(dirty) {
  state.dirty = dirty;
  $("dirtyBadge").classList.toggle("show", dirty);
  $("saveBtn").disabled = state.saving || !dirty;
  $("saveBtn").textContent = dirty ? "保存配置 ●" : "保存配置";
}
function inferType(fieldName) {
  const f = String(fieldName || "").toLowerCase();
  if (/(image|pic|photo|img)/.test(f)) return "image";
  if (/(audio|voice|sound|music|speech)/.test(f)) return "audio";
  if (/(video|mp4|mov|webm|clip)/.test(f)) return "video";
  return "text";
}
function effectiveType(node) {
  if (node && node.value_type) return node.value_type;
  const auto = node && node.effective_type;
  if (auto && auto !== "text") return auto;
  if (node && node.field_name) return inferType(node.field_name);
  return "text";
}
function typeMeta(type) { return TYPE_META[type] || TYPE_META[""]; }
function valuePreview(node) {
  const v = String(node.field_value || "").trim();
  if (v) return v;
  const t = effectiveType(node);
  if (t === "prompt") return "运行时接收命令文本";
  if (t === "image" || t === "audio" || t === "video") return "等待用户上传";
  if (t === "text") return "可编辑配置（空默认值）";
  return "空默认值";
}
function normalizeNode(raw) {
  const valueType = String(raw?.value_type || "").toLowerCase();
  return {
    node_id: String(raw?.node_id || "").trim(),
    field_name: String(raw?.field_name || "prompt").trim() || "prompt",
    field_value: String(raw?.field_value || ""),
    value_type: valueType === "auto" ? "" : valueType,
    label: String(raw?.label || "").trim()
  };
}
function validateNode(raw) {
  const node = normalizeNode(raw);
  if (!node.node_id) return { ok: false, message: "节点 ID 不能为空", node };
  return { ok: true, node };
}

function filterWorkflows() {
  const q = state.search.trim().toLowerCase();
  return state.workflows
    .map((wf, index) => ({ wf, index }))
    .filter(({ wf }) => state.region === "all" || wf.region === state.region)
    .map(({ wf, index }) => {
      if (!q) return { wf, index, nodes: wf.nodes };
      const wfHit = [wf.name, wf.workflow_id].some((v) => String(v).toLowerCase().includes(q));
      const nodes = wfHit ? wf.nodes : wf.nodes.filter((node) =>
        [node.node_id, node.field_name, node.label, node.field_value, node.value_type]
          .some((v) => String(v).toLowerCase().includes(q))
      );
      return nodes.length ? { wf, index, nodes } : null;
    })
    .filter(Boolean);
}

function renderStats() {
  let nodes = 0, prompts = 0, files = 0;
  for (const wf of state.workflows) {
    nodes += wf.nodes.length;
    for (const node of wf.nodes) {
      const t = effectiveType(node);
      if (t === "prompt") prompts += 1;
      if (t === "image" || t === "audio" || t === "video") files += 1;
    }
  }
  $("statWorkflows").textContent = state.workflows.length;
  $("statNodes").textContent = nodes;
  $("statPrompts").textContent = prompts;
  $("statFiles").textContent = files;
}

function nodeRowHTML(wfIndex, nodeIndex) {
  const node = state.workflows[wfIndex].nodes[nodeIndex];
  const t = effectiveType(node);
  const meta = typeMeta(t);
  return `
    <div class="node-row" draggable="true" data-wf="${wfIndex}" data-node="${nodeIndex}">
      <span class="drag-handle" title="拖动排序">⠿</span>
      <span class="type-pill ${meta.cls}">${meta.icon} ${esc(meta.label)}</span>
      <div class="node-core">
        <div class="node-key"><span>${esc(node.node_id)}</span><span class="sep">·</span><span class="fname">${esc(node.field_name)}</span></div>
        <div class="node-value" title="${esc(node.field_value || "")}">${esc(valuePreview(node))}</div>
      </div>
      <div class="node-label" title="${esc(node.label || "")}">${esc(node.label || "未设置说明")}</div>
      <div class="node-actions">
        <button class="icon-btn" data-act="move-node" data-wf="${wfIndex}" data-node="${nodeIndex}" data-dir="-1" title="上移">↑</button>
        <button class="icon-btn" data-act="move-node" data-wf="${wfIndex}" data-node="${nodeIndex}" data-dir="1" title="下移">↓</button>
        <button class="icon-btn" data-act="edit-node" data-wf="${wfIndex}" data-node="${nodeIndex}" title="编辑">✎</button>
        <button class="icon-btn danger" data-act="del-node" data-wf="${wfIndex}" data-node="${nodeIndex}" title="删除">✕</button>
      </div>
    </div>`;
}

function workflowCardHTML({ wf, index, nodes }) {
  const regionText = wf.region === "domestic" ? "国内" : "国外";
  const regionCls = wf.region === "domestic" ? "domestic" : "overseas";
  const rows = nodes.map((node) => {
    const realIndex = wf.nodes.indexOf(node);
    return nodeRowHTML(index, realIndex);
  }).join("");
  return `
    <article class="workflow-card">
      <div class="wf-head">
        <div class="wf-title">
          <h2>${esc(wf.name)}</h2>
          <span class="wf-id">${esc(wf.workflow_id)}</span>
        </div>
        <div class="wf-actions">
          <button class="btn small" data-act="analyze" data-wf="${index}" title="拉取工作流并智能识别节点">✨ 识别</button>
          <button class="btn small" data-act="add-node" data-wf="${index}">＋ 节点</button>
          <button class="icon-btn" data-act="edit-wf" data-wf="${index}" title="编辑工作流">✎</button>
          <button class="icon-btn danger" data-act="del-wf" data-wf="${index}" title="删除工作流">✕</button>
        </div>
      </div>
      <div class="badges">
        <span class="badge ${regionCls}">${wf.region === "domestic" ? "🇨🇳" : "🌍"} ${regionText} · runninghub.${wf.region === "domestic" ? "cn" : "ai"}</span>
        <span class="badge">⚡ ${esc(wf.instance_type)}</span>
        ${wf.llm_enhance ? '<span class="badge llm">✦ LLM 扩写</span>' : ""}
        <span class="badge">🧩 ${wf.nodes.length} 个节点</span>
      </div>
      <div class="node-zone">
        <div class="node-zone-head"><b>输入节点</b><span>拖动左侧把手调整顺序</span><span class="spacer"></span>${nodes.length !== wf.nodes.length ? `<span>已筛选 ${nodes.length}/${wf.nodes.length}</span>` : ""}</div>
        <div class="node-list">${rows || '<div class="node-empty">还没有输入节点，点击「＋ 节点」添加</div>'}</div>
      </div>
    </article>`;
}

function render() {
  const filtered = filterWorkflows();
  renderStats();
  const grid = $("workflowGrid");
  grid.innerHTML = filtered.map(workflowCardHTML).join("");
  $("emptyState").classList.toggle("hidden", filtered.length > 0 || state.loading);
  grid.classList.toggle("hidden", filtered.length === 0);
}

function mutate(fn) {
  fn();
  setDirty(true);
  render();
}

function populateWorkflowSelect(selectedName = "") {
  const sel = $("nodeWorkflow");
  sel.innerHTML = state.workflows.map((wf) =>
    `<option value="${esc(wf.name)}"${wf.name === selectedName ? " selected" : ""}>${esc(wf.name)}</option>`
  ).join("");
}

function openWorkflowDialog(index) {
  workflowDialogIndex = index;
  const wf = index >= 0 ? state.workflows[index] : null;
  $("workflowDialogTitle").textContent = wf ? "编辑工作流" : "新建工作流";
  $("wfName").value = wf?.name || "";
  $("wfId").value = wf?.workflow_id || "";
  $("wfInstance").value = wf?.instance_type || "Standard";
  $("wfRegion").value = wf?.region || "overseas";
  $("wfEnhance").checked = Boolean(wf?.llm_enhance);
  $("wfTemplate").value = wf?.llm_template_path || "";
  $("workflowDialog").showModal();
}

function saveWorkflowFromDialog() {
  const name = $("wfName").value.trim();
  const workflowId = $("wfId").value.trim();
  if (!name) return toast("请填写工作流名称", "err");
  if (!workflowId) return toast("请填写工作流 ID", "err");
  const duplicate = state.workflows.findIndex((wf, i) => wf.name === name && i !== workflowDialogIndex);
  if (duplicate >= 0) return toast(`工作流名称「${name}」已存在`, "err");
  const data = {
    name,
    workflow_id: workflowId,
    instance_type: $("wfInstance").value,
    region: $("wfRegion").value,
    llm_enhance: $("wfEnhance").checked,
    llm_template_path: $("wfTemplate").value.trim(),
    nodes: workflowDialogIndex >= 0 ? clone(state.workflows[workflowDialogIndex].nodes) : []
  };
  mutate(() => {
    if (workflowDialogIndex >= 0) state.workflows[workflowDialogIndex] = data;
    else state.workflows.push(data);
  });
  $("workflowDialog").close();
  toast(workflowDialogIndex >= 0 ? "工作流已更新（记得保存）" : "工作流已添加（记得保存）", "ok");
}

function updateNodeTypeHint() {
  const valueType = $("nodeType").value;
  const fieldName = $("nodeField").value.trim();
  const hint = $("nodeTypeHint");
  if (valueType) hint.textContent = typeMeta(valueType).hint;
  else hint.textContent = `自动推断：字段名「${fieldName || "空"}」将按 ${inferType(fieldName || "prompt")} 处理。`;
}

function openNodeDialog(wfIndex, nodeIndex) {
  nodeDialogState = { wf: wfIndex, node: nodeIndex };
  const node = nodeIndex >= 0 ? state.workflows[wfIndex].nodes[nodeIndex] : null;
  populateWorkflowSelect(state.workflows[wfIndex].name);
  $("nodeWorkflow").disabled = nodeIndex >= 0;
  $("nodeDialogTitle").textContent = node ? "编辑输入节点" : "添加输入节点";
  $("nodeId").value = node?.node_id || "";
  $("nodeField").value = node?.field_name || "prompt";
  $("nodeValue").value = node?.field_value || "";
  $("nodeType").value = node?.value_type || "";
  $("nodeLabel").value = node?.label || "";
  updateNodeTypeHint();
  $("nodeDialog").showModal();
}

function saveNodeFromDialog() {
  const check = validateNode({
    node_id: $("nodeId").value,
    field_name: $("nodeField").value,
    field_value: $("nodeValue").value,
    value_type: $("nodeType").value,
    label: $("nodeLabel").value
  });
  if (!check.ok) return toast(check.message, "err");
  const targetName = $("nodeWorkflow").value;
  let wfIndex = state.workflows.findIndex((wf) => wf.name === targetName);
  if (wfIndex < 0) wfIndex = nodeDialogState.wf;
  if (wfIndex < 0) return toast("请先创建或选择工作流", "err");
  const wf = state.workflows[wfIndex];
  const node = check.node;
  const duplicate = wf.nodes.findIndex((n, i) =>
    n.node_id === node.node_id && n.field_name === node.field_name && i !== nodeDialogState.node
  );
  if (duplicate >= 0) return toast(`节点 ${node.node_id}/${node.field_name} 已存在`, "err");
  if (node.value_type === "prompt") {
    const promptIndex = wf.nodes.findIndex((n, i) =>
      i !== nodeDialogState.node && effectiveType(n) === "prompt" && String(n.value_type || "") === "prompt"
    );
    if (promptIndex >= 0) return toast("该工作流已有主提示词节点，最多 1 个", "err");
  }
  mutate(() => {
    if (nodeDialogState.node >= 0) wf.nodes[nodeDialogState.node] = node;
    else wf.nodes.push(node);
  });
  $("nodeDialog").close();
  toast(nodeDialogState.node >= 0 ? "节点已更新" : "节点已添加", "ok");
}

function askConfirm(title, text, okLabel = "确认") {
  $("confirmTitle").textContent = title;
  $("confirmText").textContent = text;
  $("confirmOkBtn").textContent = okLabel;
  $("confirmDialog").showModal();
  return new Promise((resolve) => { confirmResolver = resolve; });
}

async function loadConfig() {
  state.loading = true;
  render();
  const res = await bridge.apiGet("page/config");
  if (!res || res.success === false) throw new Error(res?.message || "读取配置失败");
  const data = res.data || res;
  state.workflows = Array.isArray(data.workflows) ? clone(data.workflows) : [];
  state.original = clone(state.workflows);
  state.loading = false;
  setDirty(false);
  render();
  $("pluginMeta").textContent = data.plugin_name || "runninghub_workflow_adapter";
}

async function saveConfig() {
  if (state.saving) return;
  state.saving = true;
  $("saveBtn").disabled = true;
  $("saveBtn").textContent = "保存中…";
  try {
    const res = await bridge.apiPost("page/config", { workflows: state.workflows });
    if (!res || res.success === false) throw new Error(res?.message || "保存失败");
    state.original = clone(state.workflows);
    setDirty(false);
    toast(res.message || `已保存 ${res.workflow_nodes || 0} 个节点`, "ok");
  } catch (err) {
    toast(String(err?.message || err), "err", 5000);
  } finally {
    state.saving = false;
    setDirty(state.dirty);
  }
}

async function runAnalyze() {
  const wfIndex = analyzeState.wf;
  if (wfIndex < 0) return;
  const wf = state.workflows[wfIndex];
  const btn = $("azRunBtn");
  btn.disabled = true;
  btn.textContent = "识别中…";
  try {
    const res = await bridge.apiPost("page/analyze", {
      workflow_id: wf.workflow_id,
      region: $("azRegion").value,
      detailed: $("azDetailed").checked
    });
    if (!res || res.success === false) throw new Error(res?.message || "识别失败");
    analyzeState.nodes = (res.nodes || []).map(normalizeNode).filter((n) => n.node_id);
    analyzeState.method = res.method || "";
    $("azResult").innerHTML = analyzeState.nodes.length
      ? `<div class="muted" style="margin-bottom:8px">识别方式：${esc(analyzeState.method)} · 共 ${analyzeState.nodes.length} 个节点</div>` +
        analyzeState.nodes.map((n) =>
          `<span class="node-chip">${esc(n.node_id)} · ${esc(n.field_name)} · ${esc(typeMeta(effectiveType(n)).label)}${n.label ? ` · ${esc(n.label)}` : ""}</span>`
        ).join("")
      : '<div class="muted">没有识别到可编辑输入节点。</div>';
    $("azReplaceBtn").hidden = analyzeState.nodes.length === 0;
    $("azMergeBtn").hidden = analyzeState.nodes.length === 0;
    toast(`识别完成：${analyzeState.nodes.length} 个节点`, "ok");
  } catch (err) {
    $("azResult").innerHTML = `<div class="muted" style="color:var(--danger)">${esc(String(err?.message || err))}</div>`;
    $("azReplaceBtn").hidden = true;
    $("azMergeBtn").hidden = true;
    toast(String(err?.message || err), "err", 5000);
  } finally {
    btn.disabled = false;
    btn.textContent = "✨ 开始识别";
  }
}

function applyAnalyze(mode) {
  const wf = state.workflows[analyzeState.wf];
  if (!wf || !analyzeState.nodes.length) return;
  mutate(() => {
    if (mode === "replace") {
      wf.nodes = clone(analyzeState.nodes);
    } else {
      for (const node of analyzeState.nodes) {
        const index = wf.nodes.findIndex((n) => n.node_id === node.node_id && n.field_name === node.field_name);
        if (index >= 0) wf.nodes[index] = node;
        else wf.nodes.push(node);
      }
    }
  });
  $("analyzeDialog").close();
  toast(mode === "replace" ? "已替换为识别结果" : "已合并识别结果", "ok");
}

function openAnalyzeDialog(wfIndex) {
  const wf = state.workflows[wfIndex];
  if (!wf) return;
  analyzeState = { wf: wfIndex, nodes: [], method: "" };
  $("azWorkflowName").textContent = `${wf.name} · ${wf.workflow_id}`;
  $("azRegion").value = wf.region === "domestic" ? "domestic" : "overseas";
  $("azDetailed").checked = false;
  $("azResult").innerHTML = '<div class="muted">点击下方按钮拉取工作流并识别输入节点；结果不会自动保存。</div>';
  $("azReplaceBtn").hidden = true;
  $("azMergeBtn").hidden = true;
  $("azRunBtn").disabled = false;
  $("azRunBtn").textContent = "✨ 开始识别";
  $("analyzeDialog").showModal();
}

document.addEventListener("click", async (event) => {
  const closeTarget = event.target.closest("[data-close]");
  if (closeTarget) {
    const dlg = $(closeTarget.dataset.close);
    if (dlg) dlg.close();
    return;
  }
  const button = event.target.closest("[data-act]");
  if (!button) return;
  const act = button.dataset.act;
  const wfIndex = Number(button.dataset.wf || -1);
  const nodeIndex = Number(button.dataset.node || -1);

  if (act === "add-wf") openWorkflowDialog(-1);
  else if (act === "edit-wf") openWorkflowDialog(wfIndex);
  else if (act === "del-wf") {
    const wf = state.workflows[wfIndex];
    if (!wf) return;
    const ok = await askConfirm("删除工作流", `确定删除「${wf.name}」及其 ${wf.nodes.length} 个输入节点吗？`, "删除");
    if (!ok) return;
    mutate(() => state.workflows.splice(wfIndex, 1));
    toast("工作流已删除（记得保存）", "warn");
  }
  else if (act === "add-node") openNodeDialog(wfIndex, -1);
  else if (act === "edit-node") openNodeDialog(wfIndex, nodeIndex);
  else if (act === "del-node") {
    const wf = state.workflows[wfIndex];
    const node = wf?.nodes[nodeIndex];
    if (!node) return;
    const ok = await askConfirm("删除节点", `确定删除节点 ${node.node_id}/${node.field_name} 吗？`, "删除");
    if (!ok) return;
    mutate(() => wf.nodes.splice(nodeIndex, 1));
    toast("节点已删除（记得保存）", "warn");
  }
  else if (act === "move-node") {
    const dir = Number(button.dataset.dir || 0);
    const wf = state.workflows[wfIndex];
    const target = nodeIndex + dir;
    if (!wf || target < 0 || target >= wf.nodes.length) return;
    mutate(() => { const [n] = wf.nodes.splice(nodeIndex, 1); wf.nodes.splice(target, 0, n); });
  }
  else if (act === "analyze") openAnalyzeDialog(wfIndex);
});

let drag = null;
document.addEventListener("dragstart", (event) => {
  const row = event.target.closest(".node-row");
  if (!row) return;
  drag = { wf: Number(row.dataset.wf), node: Number(row.dataset.node) };
  event.dataTransfer.effectAllowed = "move";
  try { event.dataTransfer.setData("text/plain", ""); } catch {}
  requestAnimationFrame(() => row.classList.add("dragging"));
});
document.addEventListener("dragover", (event) => {
  if (!drag) return;
  const row = event.target.closest(".node-row");
  if (!row) return;
  event.preventDefault();
  const rect = row.getBoundingClientRect();
  const before = event.clientY < rect.top + rect.height / 2;
  row.classList.toggle("drop-before", before);
  row.classList.toggle("drop-after", !before);
});
document.addEventListener("drop", (event) => {
  if (!drag) return;
  const row = event.target.closest(".node-row");
  if (!row) return;
  event.preventDefault();
  const toWf = Number(row.dataset.wf);
  const toNode = Number(row.dataset.node);
  const rect = row.getBoundingClientRect();
  const before = event.clientY < rect.top + rect.height / 2;
  row.classList.remove("drop-before", "drop-after");
  mutate(() => {
    const fromWf = state.workflows[drag.wf];
    if (!fromWf) return;
    const [moved] = fromWf.nodes.splice(drag.node, 1);
    let target = toNode;
    if (drag.wf === toWf && drag.node < toNode) target -= 1;
    if (!before) target += 1;
    const dest = state.workflows[toWf];
    if (!dest) { fromWf.nodes.splice(Math.min(drag.node, fromWf.nodes.length), 0, moved); return; }
    dest.nodes.splice(Math.max(0, Math.min(target, dest.nodes.length)), 0, moved);
  });
  drag = null;
});
document.addEventListener("dragend", () => {
  if (!drag) return;
  document.querySelectorAll(".node-row").forEach((row) => {
    row.classList.remove("dragging", "drop-before", "drop-after");
  });
  drag = null;
});

$("workflowSaveBtn").addEventListener("click", saveWorkflowFromDialog);
$("nodeSaveBtn").addEventListener("click", saveNodeFromDialog);
$("azRunBtn").addEventListener("click", runAnalyze);
$("azReplaceBtn").addEventListener("click", () => applyAnalyze("replace"));
$("azMergeBtn").addEventListener("click", () => applyAnalyze("merge"));
$("addWorkflowBtn").addEventListener("click", () => openWorkflowDialog(-1));
$("refreshBtn").addEventListener("click", async () => {
  try { await loadConfig(); toast("配置已刷新", "ok"); }
  catch (err) { toast(String(err?.message || err), "err"); }
});
$("saveBtn").addEventListener("click", saveConfig);
$("searchInput").addEventListener("input", (event) => { state.search = event.target.value; render(); });
$("regionFilter").addEventListener("change", (event) => { state.region = event.target.value; render(); });
$("nodeType").addEventListener("change", updateNodeTypeHint);
$("nodeField").addEventListener("input", updateNodeTypeHint);
$("confirmOkBtn").addEventListener("click", () => { $("confirmDialog").close(); if (confirmResolver) confirmResolver(true); confirmResolver = null; });
$("confirmCancelBtn").addEventListener("click", () => { $("confirmDialog").close(); if (confirmResolver) confirmResolver(false); confirmResolver = null; });

document.addEventListener("keydown", (event) => {
  if ((event.ctrlKey || event.metaKey) && String(event.key).toLowerCase() === "s") {
    event.preventDefault();
    if (!state.dirty) toast("当前没有未保存的修改", "info", 1800);
    else saveConfig();
  }
});
window.addEventListener("beforeunload", (event) => {
  if (state.dirty) { event.preventDefault(); event.returnValue = ""; }
});

async function init() {
  try {
    if (!bridge || typeof bridge.ready !== "function") throw new Error("未检测到 AstrBot Plugin Page Bridge，请从 AstrBot WebUI 的插件页面入口打开本页面。");
    const context = await bridge.ready();
    $("pluginMeta").textContent = context?.displayName || context?.pluginName || "runninghub_workflow_adapter";
    await loadConfig();
    toast("已连接插件并读取配置", "ok", 2200);
  } catch (err) {
    state.loading = false;
    render();
    toast(String(err?.message || err), "err", 8000);
  }
}
init();
</script>
</body>
</html>
