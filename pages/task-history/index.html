<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>RunningHub 任务记录</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo-mark"><span class="icon icon-history" style="width:20px;height:20px" aria-hidden="true"></span></div>
      <div>
        <h1>RunningHub 任务记录</h1>
        <p class="sub" id="pluginMeta">runninghub_workflow_adapter</p>
      </div>
    </div>
    <div class="actions" style="display:flex;align-items:center;gap:8px">
      <button class="btn text" id="refreshBtn"><span class="icon icon-refresh" style="width:18px;height:18px" aria-hidden="true"></span>刷新</button>
      <button class="btn danger-text" id="clearBtn"><span class="icon icon-delete" style="width:18px;height:18px" aria-hidden="true"></span>清空记录</button>
    </div>
  </header>

  <section class="summary-grid">
    <div class="stat-card">
      <div class="stat-icon blue"><span class="icon icon-history" style="width:20px;height:20px" aria-hidden="true"></span></div>
      <div class="stat-body"><b id="statCount">0</b><span>最近任务记录</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon amber"><span class="icon icon-wallet" style="width:20px;height:20px" aria-hidden="true"></span></div>
      <div class="stat-body"><b id="statTotal">0</b><span>累计消耗 RH 币</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green"><span class="icon icon-refresh" style="width:20px;height:20px" aria-hidden="true"></span></div>
      <div class="stat-body"><b id="statUpdated">—</b><span>最近更新时间</span></div>
    </div>
  </section>

  <section class="panel">
    <div class="section-head" style="padding:14px 18px 0">
      <h2><span class="icon icon-history" style="width:16px;height:16px" aria-hidden="true"></span>最近任务记录<span class="count" id="taskCountLabel"></span></h2>
    </div>
    <div class="task-head">
      <div>任务 ID</div>
      <div>工作流</div>
      <div style="text-align:right">RH 币消耗</div>
    </div>
    <div id="taskList"></div>
    <div class="empty hidden" id="emptyState">
      <div class="big"><span class="icon icon-history" style="width:28px;height:28px" aria-hidden="true"></span></div>
      <h3>还没有任务记录</h3>
      <p>通过插件运行工作流后，成功的任务会记录到这里（任务 ID / 工作流 / RH 币消耗）。</p>
    </div>
  </section>
</div>

<dialog id="clearDialog">
  <div class="dialog">
    <h3>清空任务记录？</h3>
    <p>这会删除插件保存的最近任务记录，RunningHub 平台上的账单不会受影响。</p>
    <div class="dialog-foot">
      <button class="btn text" id="clearCancelBtn">取消</button>
      <button class="btn danger-text" id="clearOkBtn">清空</button>
    </div>
  </div>
</dialog>

<div id="toasts"></div>

<script type="module">
const bridge = window.AstrBotPluginPage;
const state = { records: [], loading: true, updatedAt: "" };
const $ = (id) => document.getElementById(id);

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}
function normalizeApiResponse(raw) {
  if (!raw || typeof raw !== "object") return raw;
  if (raw.success === false) return raw;
  if (raw.data && typeof raw.data === "object") return raw.data;
  return raw;
}
function toast(message, type = "info", duration = 3200) {
  const el = document.createElement("div");
  el.className = `toast ${type === "ok" ? "ok" : type === "err" ? "err" : type === "warn" ? "warn" : ""}`;
  el.textContent = message;
  $("toasts").appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 220); }, duration);
}
function coinValue(value) {
  const n = Number(String(value ?? "0").replace(/[,\s]/g, ""));
  return Number.isFinite(n) ? n : 0;
}
function formatCoins(value) {
  const n = coinValue(value);
  if (Math.abs(n) >= 1e6) return n.toFixed(2);
  if (Number.isInteger(n)) return String(n);
  return String(Number(n.toFixed(4)));
}
function nowTime() {
  const now = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}

function taskRow(record) {
  const taskId = esc(record.task_id || "");
  const workflow = record.workflow || "";
  const coins = esc(formatCoins(record.coins));
  return `<div class="task-row">
    <div class="task-id" title="点击复制任务 ID" data-copy="${taskId}">${taskId}<span class="copy-hint">复制</span></div>
    <div class="task-workflow"><span class="chip">${workflow ? esc(workflow) : "未记录工作流"}</span></div>
    <div class="task-coins"><span class="coin-icon"><span class="icon icon-wallet" style="width:14px;height:14px" aria-hidden="true"></span></span><b>${coins}</b><span>RH 币</span></div>
  </div>`;
}

function renderTasks() {
  const records = state.records;
  const total = records.reduce((sum, item) => sum + coinValue(item.coins), 0);
  $("statCount").textContent = String(records.length);
  $("statTotal").textContent = formatCoins(total);
  $("statUpdated").textContent = state.updatedAt || "—";
  $("taskCountLabel").textContent = records.length ? `共 ${records.length} 条` : "";
  $("taskList").innerHTML = records.map(taskRow).join("");
  $("emptyState").classList.toggle("hidden", records.length > 0);
  $("clearBtn").disabled = state.loading || records.length === 0;
}

async function loadTasks() {
  state.loading = true;
  $("refreshBtn").disabled = true;
  renderTasks();
  try {
    const res = normalizeApiResponse(await bridge.apiGet("page/tasks"));
    if (!res || res.success === false) throw new Error(res?.message || "读取任务记录失败");
    state.records = Array.isArray(res.records) ? res.records.filter((item) => item && item.task_id) : [];
    state.updatedAt = nowTime();
    toast(`已读取 ${state.records.length} 条任务记录`, "ok", 1800);
  } catch (err) {
    toast(String(err?.message || err), "err", 6000);
  } finally {
    state.loading = false;
    $("refreshBtn").disabled = false;
    renderTasks();
  }
}

async function copyTaskId(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const area = document.createElement("textarea");
      area.value = text;
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }
    toast("任务 ID 已复制", "ok", 1600);
  } catch {
    toast("复制失败，请手动选择复制", "err", 2400);
  }
}

$("refreshBtn").addEventListener("click", loadTasks);
$("taskList").addEventListener("click", (event) => {
  const target = event.target.closest("[data-copy]");
  if (target) copyTaskId(target.getAttribute("data-copy"));
});
$("clearBtn").addEventListener("click", () => $("clearDialog").showModal());
$("clearCancelBtn").addEventListener("click", () => $("clearDialog").close());
$("clearOkBtn").addEventListener("click", async () => {
  $("clearDialog").close();
  $("clearOkBtn").disabled = true;
  try {
    const res = normalizeApiResponse(await bridge.apiPost("page/tasks/clear", {}));
    if (!res || res.success === false) throw new Error(res?.message || "清空失败");
    state.records = [];
    state.updatedAt = nowTime();
    renderTasks();
    toast(res.message || "任务记录已清空", "ok");
  } catch (err) {
    toast(String(err?.message || err), "err", 6000);
  } finally {
    $("clearOkBtn").disabled = false;
  }
});

async function init() {
  try {
    if (!bridge || typeof bridge.ready !== "function") throw new Error("未检测到 AstrBot Plugin Page Bridge，请从 AstrBot WebUI 的插件页面入口打开本页面。");
    const context = await bridge.ready();
    $("pluginMeta").textContent = context?.displayName || context?.pluginName || "runninghub_workflow_adapter";
    await loadTasks();
  } catch (err) {
    state.loading = false;
    renderTasks();
    toast(String(err?.message || err), "err", 8000);
  }
}
init();
</script>
</body>
</html>
